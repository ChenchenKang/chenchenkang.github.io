-header"> <h1 class="post-title">Extension</h1> <p class="post-description">Extension activities and community engagement.</p> </header> <article> <style>.extension-gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2rem 1.5rem;margin-top:1.5rem}.extension-item{margin:0}.extension-item img{width:100%;aspect-ratio:4 / 3;object-fit:cover;display:block;border-radius:4px}.extension-item figcaption{margin-top:.65rem;font-size:.95rem;line-height:1.5}@media(max-width:768px){.extension-gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:576px){.extension-gallery{grid-template-columns:1fr}}</style> <div class="extension-gallery"> <figure class="extension-item"> <img src="/assets/img/extension/nrc_field_day.png" alt="Extension activity at the Nursery Research Center" loading="lazy"> <figcaption> May 7, 2026: Presenting current progress and future opportunities for robotic spraying in specialty crops and nursery production at the 2026 Otis L. Floyd Nursery Research Center Field Day. </figcaption> </figure> <figure class="extension-item"> <img src="/assets/img/extension/umd_field_day_2025.png" alt="Field demonstration of a robotic sprayer for improved spray-region control and coverage in raspberries." loading="lazy"> <figcaption> July 30, 2025: Demonstrating a robotic sprayer designed to improve control of spray regions and coverage in raspberry production at the 2025 Western Maryland Research and Education Center Field Day. </figcaption> </figure> <figure class="extension-item"> <img src="/assets/img/extension/frec_field_day_2025.png" alt="Demonstrating a low-cost orchard sensor station to growers and farmers" loading="lazy"> <figcaption> June 25, 2025: Demonstrating a multifunctional, low-cost sensor station for orchard management to growers and farmers at the 2025 Penn State Fruit Research and Extension Center Field Day. </figcaption> </figure> <figure class="extension-item"> <img src="/assets/img/extension/frec_field_day_spray_2025.png" alt="Field demonstration of a computer-vision-guided precision sprayer for targeted green fruit chemical thinning." loading="lazy"> <figcaption> June 25, 2025: Demonstrating the integration of computer vision and precision sprayers for targeted green fruit chemical thinning to growers and farmers at the 2025 Penn State Fruit Research and Extension Center Field Day. </figcaption> </figure> <figure class="extension-item"> <img src="/assets/img/extension/md_grape.png" alt="Vineyard field demonstration of a robotic sprayer for improved spray-region control and coverage." loading="lazy"> <figcaption> June 21, 2025: Demonstrating a robotic sprayer designed to improve control of spray regions and coverage in vineyards at the 2025 Maryland Grape Growers Association Summer Field Day. </figcaption> </figure> <figure class="extension-item"> <img src="/assets/img/extension/mafvc_iot_2025.png" alt="Invited presentation on IoT and computer vision technologies for monitoring soilless greenhouse leafy greens." loading="lazy"> <figcaption> January 29, 2025: Invited presentation on IoT and computer vision technologies for monitoring soilless greenhouse leafy greens. </figcaption> </figure> <figure class="extension-item"> <img src="/assets/img/extension/mafvc_weather_2025.png" alt="Presentation on a low-cost microclimate monitoring system for orchard disease management." loading="lazy"> <figcaption> January 30, 2025: Presenting a low-cost microclimate monitoring system for orchard disease management at the 2025 Mid-Atlantic Fruit and Vegetable Convention. </figcaption> </figure> <figure class="extension-item"> <img src="/assets/img/extension/agprogress_2024.png" alt="Demonstration and presentation of an IoT- and computer-vision-based monitoring system for soilless greenhouse leafy green production." loading="lazy"> <figcaption> August 14, 2024: Demonstrating a monitoring system and presenting the use of Internet of Things technologies and computer vision to improve the management and sustainability of soilless greenhouse leafy green production at Penn State’s 2024 Ag Progress Days. </figcaption> </figure> </div> </article> </div> </div> <footer class="fixed-bottom" role="contentinfo"> <div class="container mt-0"> © Copyright 2026 Chenchen Kang 康琛琛. Powered by <a href="https://jekyllrb.com/" target="_blank" rel="external nofollow noopener">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio" rel="external nofollow noopener" target="_blank">al-folio</a> theme. Hosted by <a href="https://pages.github.com/" target="_blank" rel="external nofollow noopener">GitHub Pages</a>. </div> </footer> <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script> <script src="/assets/js/bootstrap.bundle.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/js/mdb.min.js" integrity="sha256-NdbiivsvWt7VYCt6hYNT3h/th9vSTL4EDWeGs5SN3DA=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js" integrity="sha256-Nn1q/fx0H7SNLZMQ5Hw5JLaTRZp0yILA/FRexe19VdI=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/imagesloaded@5.0.0/imagesloaded.pkgd.min.js" integrity="sha256-htrLFfZJ6v5udOG+3kNLINIKh2gvoKqwEhHYfTTMICc=" crossorigin="anonymous"></script> <script defer src="/assets/js/masonry.js?a0db7e5d5c70cc3252b3138b0c91dcaf" type="text/javascript"></script> <script defer src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js" integrity="sha256-ZgMyDAIYDYGxbcpJcfUnYwNevG/xi9OHKaR/8GK+jWc=" crossorigin="anonymous"></script> <script defer src="/assets/js/zoom.js?85ddb88934d28b74e78031fd54cf8308"></script> <script src="/assets/js/no_defer.js?2781658a0a2b13ed609542042a859126"></script> <script defer src="/assets/js/common.js?c15de51d4bb57887caa2c21988d97279"></script> <script defer src="/assets/js/copy_cod
